<html>
    <head>
        <title>Latihan tabel</title>
    </head>
    <body>
        <h3>Latihan tabel</h3>
        <table border="1" width="200">
            <tr>
                <th>x</th>
                <th>A</th>
                <th>B</th>
                
            </tr>
            <tr>
                <td>D</td>
                <td>AD</td>
                <td>BD</td>
                
            </tr>
            <tr>
                <td>C</td>
                <td>AC</td>
                <td>CB</td>
                
            </tr>
            <tr>
                <td>E</td>
                <td>AE</td>
                <td>BE</td>
                
            </tr>
        </table> <br> 
        <table border="1" width="200">
            <tr>
                <th>x</th>
                <th>5</th>
                <th>8</th>
                
            </tr>
            <tr>
                <th>7</th>
                <td>35</td>
                <td>56</td>
                
            </tr>
            <tr>
                <th>6</th>
                <td>30</td>
                <td>48</td>
                
            </tr>
            <tr>
                <th>8</th>
                <td>40</td>
                <td>64</td>
                
            </tr>
        </table>

        <hr>

        <h3>Latihan tabel - 2</h3>
        <table width="300" border="1">
            <tr align="center">
                <th colspan="2">1, 2</th>
                
                <th colspan="2">3, 4</th>
                
            </tr>
            <tr align="center">
                <td>5</td>
                <td>6</td>
                <td>7</td>
                <td>8</td>
                
            </tr>
            <tr align="center">
                <td>9</td>
                <td>10</td>
                <td>11</td>
                <td>12</td>
                
            </tr>
            <tr>
                <th colspan="4">13, 14, 15, 16</th>
                
                
            </tr>

        </table>

         <hr>

        <h3>Latihan tabel - 3</h3>
        <table width="300" border="1">
            <tr align="center">
                <th rowspan="4">1, 4, 7, 10</th>
                <td width="100">2</td>
                <td width="100">3</td>
                
                
            </tr>
            <tr align="center">
                <td>5</td>
                <td rowspan="2">6, 9</td>
                
                
                
            </tr>
            <tr align="center">
                <td>8</td>
                
                
            </tr>
            <tr>
                <th>9</th>
                <th>10</th>
                
                
            </tr>

        </table>

    </body>
</html>
